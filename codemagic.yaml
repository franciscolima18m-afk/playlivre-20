workflows:
  android-build:
    name: PlayLivre Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Criar arquivos Android
        script: |
          flutter create --platforms=android .

      - name: Compilar APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
