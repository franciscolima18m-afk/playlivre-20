workflows:
  android-build:
    name: PlayLivre Android

    environment:
      flutter: stable

    scripts:
      - name: Ver arquivos do projeto
        script: |
          pwd
          ls -la

      - name: Gerar plataforma Android
        script: |
          flutter create .
          ls -la
          ls -la android

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Gerar APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk