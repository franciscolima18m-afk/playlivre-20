workflows:
  playlivre-android:
    name: PlayLivre Android

    environment:
      flutter: stable

    scripts:
      - name: Verificar arquivos
        script: |
          pwd
          ls -la

      - name: Criar Android
        script: |
          flutter create --platforms=android .

      - name: Verificar Android
        script: |
          ls -la
          ls -la android

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Gerar APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
