workflows:
  flutter:
    name: PlayLivre Android APK

    environment:
      flutter: stable

    scripts:
      - name: Criar plataforma Android
        script: |
          flutter create --platforms=android .

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Compilar APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
