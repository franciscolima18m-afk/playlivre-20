workflows:
  palylivre-android:
    name: Palylivre Android Build

    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Criar estrutura Android
        script: |
          flutter create --platforms=android .

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Verificar projeto
        script: |
          flutter analyze

      - name: Gerar APK
        script: |
          flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.apk